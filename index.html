<title>ANS 진행고객</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: stationery desk — stitched white sidebar, blush ground, gingham hero with taped stat cards; serif titles (Gowun Batang + Fraunces italic) over a clean sans body */
:root {
  --bg: #FFF8F9; --surface: #FFFFFF; --surface-2: #FFF5F7; --line: #F6E3E9; --line-2: #FBEEF2; --line-strong: #EFCFDA;
  --ink: #4A3B42; --ink-h: #3E2F37; --ink-2: #6B5A62; --muted: #9A8790; --faint: #BBA9B1;
  --primary: #E77E9E; --primary-ink: #C2547A; --primary-soft: #FFE9F0; --primary-line: #F6C3D3; --on-primary: #FFFFFF;
  --eyebrow: #D07896; --stitch: #F3C9D6;
  --gingham: rgba(239, 143, 175, .16); --gingham-bg: #FFF1F5;
  --lav-bg: #F4EDFF; --lav-bd: #E6DAFA; --lav-fg: #8A6CC2;
  --rose-bg: #FFEAF0; --rose-bd: #F8D3DF; --rose-fg: #C9577C;
  --cream-bg: #FFF5DA; --cream-bd: #F5E4B4; --cream-fg: #A9842F;
  --mint-bg: #E7F6EE; --mint-bd: #CDEBDB; --mint-fg: #4B9673;
  --sky-bg: #E9F1FF; --sky-bd: #D3E1FA; --sky-fg: #5A7FBD;
  --sand-bg: #FFEFE3; --sand-bd: #F6DCC8; --sand-fg: #B9744A;
  --red-bg: #FDE6E8; --red-bd: #F6CDD2; --red-fg: #C2475B;
  --grey-bg: #F5EFF2; --grey-bd: #EADFE4; --grey-fg: #8D7F87;
  --tape-pink: rgba(247, 176, 199, .72); --tape-butter: rgba(250, 221, 140, .75); --tape-lilac: rgba(201, 178, 245, .7); --tape-mint: rgba(160, 219, 189, .72);
  --av1: linear-gradient(140deg, #FFDCE7, #F7D6F0); --av1-fg: #B25478;
  --av2: linear-gradient(140deg, #E5DBFF, #DCE6FF); --av2-fg: #7259B0;
  --av3: linear-gradient(140deg, #FFE9C9, #FFDCD3); --av3-fg: #A8693B;
  --av4: linear-gradient(140deg, #D8F2E4, #DDEFF5); --av4-fg: #3F8466;
  --av5: linear-gradient(140deg, #FFE0EC, #EFDDFB); --av5-fg: #A04C83;
  --shadow: 0 10px 28px rgba(214, 120, 152, .09);
  --shadow-sm: 0 3px 10px rgba(214, 120, 152, .07);
  --shadow-btn: 0 8px 18px rgba(231, 126, 158, .32);
  --scrim: rgba(74, 46, 60, .28);
  --f-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-title: 'Gowun Batang', 'Noto Serif KR', 'Batang', serif;
  --f-it: 'Fraunces', 'Gowun Batang', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1519; --surface: #261D22; --surface-2: #2C2228; --line: #3A2D34; --line-2: #33282E; --line-strong: #4D3A44;
    --ink: #F4E9EE; --ink-h: #FFF3F7; --ink-2: #D9C6CF; --muted: #AE97A2; --faint: #7F6A74;
    --primary: #F296B3; --primary-ink: #FFB5CC; --primary-soft: #3A2530; --primary-line: #6A3E52; --on-primary: #2A1520;
    --eyebrow: #F0A3BD; --stitch: #5A3846;
    --gingham: rgba(242, 150, 179, .08); --gingham-bg: #241A1F;
    --lav-bg: #2B2338; --lav-bd: #3D3150; --lav-fg: #C6AEF2;
    --rose-bg: #38222C; --rose-bd: #4E2F3D; --rose-fg: #F5A4BF;
    --cream-bg: #322A1A; --cream-bd: #4A3E24; --cream-fg: #E8C877;
    --mint-bg: #1C2D25; --mint-bd: #294236; --mint-fg: #8FD3B1;
    --sky-bg: #1D2638; --sky-bd: #2B3851; --sky-fg: #9FBDEE;
    --sand-bg: #33241B; --sand-bd: #4A3426; --sand-fg: #EBB08A;
    --red-bg: #3A1F24; --red-bd: #552B33; --red-fg: #F39AA6;
    --grey-bg: #2D2429; --grey-bd: #3F3339; --grey-fg: #BCA9B2;
    --tape-pink: rgba(242, 150, 179, .42); --tape-butter: rgba(232, 200, 119, .4); --tape-lilac: rgba(198, 174, 242, .4); --tape-mint: rgba(143, 211, 177, .4);
    --av1: linear-gradient(140deg, #4A2B39, #432A44); --av1-fg: #FFC3D6;
    --av2: linear-gradient(140deg, #352D4E, #2D3550); --av2-fg: #D3C3FF;
    --av3: linear-gradient(140deg, #4A3726, #4A2E2C); --av3-fg: #FFD2A8;
    --av4: linear-gradient(140deg, #24413A, #26393F); --av4-fg: #A8E6C8;
    --av5: linear-gradient(140deg, #4A2B3D, #3D2D4B); --av5-fg: #F7BDE0;
    --shadow: 0 10px 28px rgba(0, 0, 0, .3);
    --shadow-sm: 0 3px 10px rgba(0, 0, 0, .25);
    --shadow-btn: 0 8px 18px rgba(0, 0, 0, .35);
    --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1519; --surface: #261D22; --surface-2: #2C2228; --line: #3A2D34; --line-2: #33282E; --line-strong: #4D3A44;
  --ink: #F4E9EE; --ink-h: #FFF3F7; --ink-2: #D9C6CF; --muted: #AE97A2; --faint: #7F6A74;
  --primary: #F296B3; --primary-ink: #FFB5CC; --primary-soft: #3A2530; --primary-line: #6A3E52; --on-primary: #2A1520;
  --eyebrow: #F0A3BD; --stitch: #5A3846;
  --gingham: rgba(242, 150, 179, .08); --gingham-bg: #241A1F;
  --lav-bg: #2B2338; --lav-bd: #3D3150; --lav-fg: #C6AEF2;
  --rose-bg: #38222C; --rose-bd: #4E2F3D; --rose-fg: #F5A4BF;
  --cream-bg: #322A1A; --cream-bd: #4A3E24; --cream-fg: #E8C877;
  --mint-bg: #1C2D25; --mint-bd: #294236; --mint-fg: #8FD3B1;
  --sky-bg: #1D2638; --sky-bd: #2B3851; --sky-fg: #9FBDEE;
  --sand-bg: #33241B; --sand-bd: #4A3426; --sand-fg: #EBB08A;
  --red-bg: #3A1F24; --red-bd: #552B33; --red-fg: #F39AA6;
  --grey-bg: #2D2429; --grey-bd: #3F3339; --grey-fg: #BCA9B2;
  --tape-pink: rgba(242, 150, 179, .42); --tape-butter: rgba(232, 200, 119, .4); --tape-lilac: rgba(198, 174, 242, .4); --tape-mint: rgba(143, 211, 177, .4);
  --av1: linear-gradient(140deg, #4A2B39, #432A44); --av1-fg: #FFC3D6;
  --av2: linear-gradient(140deg, #352D4E, #2D3550); --av2-fg: #D3C3FF;
  --av3: linear-gradient(140deg, #4A3726, #4A2E2C); --av3-fg: #FFD2A8;
  --av4: linear-gradient(140deg, #24413A, #26393F); --av4-fg: #A8E6C8;
  --av5: linear-gradient(140deg, #4A2B3D, #3D2D4B); --av5-fg: #F7BDE0;
  --shadow: 0 10px 28px rgba(0, 0, 0, .3);
  --shadow-sm: 0 3px 10px rgba(0, 0, 0, .25);
  --shadow-btn: 0 8px 18px rgba(0, 0, 0, .35);
  --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { text-wrap: balance; color: var(--ink-h); }
.num { font-variant-numeric: tabular-nums lining-nums; }
.muted { color: var(--muted); }
svg.ic { width: 18px; height: 18px; flex: none; }
.it { font-family: var(--f-it); font-style: italic; font-weight: 400; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.sidebar {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px));
  background: var(--surface); border-right: 1.5px dashed var(--stitch);
  padding: 30px 18px 22px; display: flex; flex-direction: column; gap: 26px; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; padding: 0 6px; }
.mark { width: 46px; height: 46px; border-radius: 50%; background: var(--primary-soft); border: 1.5px dashed var(--primary-line); display: grid; place-items: center; flex: none; color: var(--primary); }
.mark svg { width: 30px; height: 22px; }
.brand b { display: block; font-family: var(--f-it); font-style: italic; font-weight: 500; font-size: 25px; line-height: 1; color: var(--ink-h); letter-spacing: -.01em; }
.brand small { display: block; font-size: 10px; letter-spacing: .22em; color: var(--eyebrow); font-weight: 500; margin-top: 4px; text-transform: uppercase; }
.eyebrow { font-family: var(--f-it); font-style: italic; font-size: 14px; color: var(--eyebrow); letter-spacing: 0; }
.side-sec { display: grid; gap: 8px; }
.side-sec .eyebrow { padding: 0 12px; }
.nav { display: grid; gap: 4px; }
.nav a { position: relative; display: flex; align-items: center; gap: 11px; padding: 11px 14px; border-radius: 999px; text-decoration: none; color: var(--ink-2); font-size: 13.5px; transition: background .15s, color .15s; line-height: 1.35; }
.nav a svg { color: var(--faint); }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); font-weight: 700; }
.nav a[aria-current="page"] svg { color: var(--primary); }
.nav a .cnt { margin-left: auto; font-family: var(--f-it); font-style: italic; font-size: 13px; color: var(--faint); }
.nav a[aria-current="page"] .cnt { color: var(--primary-ink); }
.side-foot { margin-top: auto; display: grid; gap: 16px; }
.help-card {
  position: relative; border-radius: 20px; padding: 12px;
  background-color: var(--gingham-bg);
  background-image: linear-gradient(90deg, var(--gingham) 50%, transparent 50%), linear-gradient(var(--gingham) 50%, transparent 50%);
  background-size: 18px 18px;
}
.help-card .in { background: var(--surface); border-radius: 14px; padding: 16px 14px 14px; display: grid; gap: 4px; box-shadow: var(--shadow-sm); position: relative; }
.help-card .in::before { content: ""; position: absolute; top: -8px; left: 50%; width: 56px; height: 16px; transform: translateX(-50%) rotate(-4deg); background: var(--tape-pink); clip-path: polygon(0 10%, 4% 0, 96% 0, 100% 12%, 97% 50%, 100% 88%, 96% 100%, 4% 100%, 0 90%, 3% 50%); }
.help-card b { font-family: var(--f-title); font-size: 14px; color: var(--ink-h); }
.help-card span { font-size: 12px; color: var(--muted); line-height: 1.55; }
.help-card .live { margin-top: 6px; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.live.on i { background: var(--mint-fg); box-shadow: 0 0 0 3px var(--mint-bg); }
.live.local i { background: var(--cream-fg); box-shadow: 0 0 0 3px var(--cream-bg); }
.profile { display: flex; align-items: center; gap: 10px; padding: 16px 6px 0; border-top: 1.5px dashed var(--line-strong); min-width: 0; }
.profile img { width: 36px; height: 36px; border-radius: 50%; flex: none; border: 2px solid var(--primary-soft); }
.profile b { display: block; font-size: 13px; color: var(--ink-h); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile small { display: block; font-size: 11.5px; color: var(--faint); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; gap: 16px; padding: 0 36px; min-height: 70px; }
.gsearch { position: relative; flex: 0 1 400px; min-width: 0; }
.gsearch svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--primary); }
.gsearch input { width: 100%; height: 42px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 56px 0 42px; outline: none; font-size: 13.5px; box-shadow: var(--shadow-sm); }
.gsearch input::placeholder { color: var(--faint); }
.gsearch input:focus { border-color: var(--primary-line); box-shadow: 0 0 0 4px var(--primary-soft); }
.gsearch kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 500 11px var(--f-body); color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 2px 8px; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.top-date { font-family: var(--f-it); font-style: italic; font-size: 15px; color: var(--ink-2); white-space: nowrap; }
.top-div { width: 1px; height: 22px; background: var(--line-strong); }

.content { padding: 8px 36px 72px; display: grid; gap: 26px; min-width: 0; max-width: 1480px; width: 100%; }
.notice { background: var(--cream-bg); border: 1.5px dashed var(--cream-bd); color: var(--ink-2); border-radius: 16px; padding: 11px 16px; font-size: 13px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 500; white-space: nowrap; transition: transform .12s, background .15s, box-shadow .15s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 700; box-shadow: var(--shadow-btn); }
.btn.primary:hover { transform: translateY(-1px); background: var(--primary); }
.btn.soft { background: var(--primary-soft); border-color: transparent; color: var(--primary-ink); font-weight: 700; }
.btn.danger { color: var(--red-fg); border-color: var(--red-bd); }
.btn.danger.solid { background: var(--red-fg); border-color: var(--red-fg); color: #fff; }
.btn svg { width: 16px; height: 16px; }
.btn.sm { height: 34px; padding: 0 14px; font-size: 12.5px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--primary); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 15px; height: 15px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--primary-ink); font-size: 12.5px; display: inline-flex; align-items: center; gap: 3px; font-weight: 500; }
.linkbtn:hover { text-decoration: underline; text-decoration-style: wavy; text-underline-offset: 4px; }
.linkbtn svg { width: 13px; height: 13px; }

/* ---------- hero (gingham desk) ---------- */
.hero {
  position: relative; border-radius: 30px; padding: clamp(18px, 2.6vw, 30px);
  background-color: var(--gingham-bg);
  background-image: linear-gradient(90deg, var(--gingham) 50%, transparent 50%), linear-gradient(var(--gingham) 50%, transparent 50%);
  background-size: 30px 30px;
  display: grid; gap: 30px;
}
.hero-card { position: relative; background: var(--surface); border-radius: 22px; padding: clamp(20px, 2.6vw, 30px) clamp(20px, 3vw, 34px); box-shadow: var(--shadow); display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; flex-wrap: wrap; max-width: 100%; }
.hero-card .bow { position: absolute; top: -22px; left: 28px; width: 64px; height: 44px; color: var(--primary); filter: drop-shadow(0 4px 6px rgba(214, 120, 152, .25)); }
.hero h1 { font-family: var(--f-title); font-weight: 700; font-size: clamp(26px, 3vw, 34px); line-height: 1.3; margin: 4px 0 6px; letter-spacing: -.02em; }
.hero h1 .it { color: var(--primary); font-size: .9em; letter-spacing: 0; margin-left: 4px; }
.hero p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 62ch; }
.hero p b { color: var(--primary-ink); font-weight: 700; }
.hero-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.spark { position: absolute; color: var(--cream-fg); pointer-events: none; }
.spark.s1 { top: 18px; right: 30px; width: 20px; height: 20px; }
.spark.s2 { top: 44px; right: 58px; width: 11px; height: 11px; color: var(--primary); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.stat { position: relative; border-radius: 20px; padding: 24px 22px 20px; border: 0; background: var(--surface); display: grid; gap: 2px; text-align: left; box-shadow: var(--shadow-sm); transition: transform .18s; color: inherit; }
.stat:nth-child(odd) { transform: rotate(-.6deg); }
.stat:nth-child(even) { transform: rotate(.6deg); }
.stat:hover { transform: translateY(-3px) rotate(0); }
.stat::before { content: ""; position: absolute; top: -10px; left: 50%; width: 84px; height: 22px; transform: translateX(-50%) rotate(-3deg); background: var(--tape); clip-path: polygon(0 10%, 4% 0, 96% 0, 100% 12%, 97% 50%, 100% 88%, 96% 100%, 4% 100%, 0 90%, 3% 50%); }
.stat:nth-child(even)::before { transform: translateX(-50%) rotate(4deg); }
.stat .lbl { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
.stat .lbl svg { width: 16px; height: 16px; color: var(--fg); }
.stat strong { font-family: var(--f-it); font-weight: 500; font-size: 44px; line-height: 1.1; color: var(--ink-h); font-variant-numeric: lining-nums; }
.stat strong small { font-family: var(--f-body); font-size: 14px; color: var(--muted); margin-left: 3px; font-weight: 400; }
.stat .sub { font-size: 12px; color: var(--fg); font-weight: 500; }
.stat.rose  { --tape: var(--tape-pink);   --fg: var(--rose-fg); }
.stat.cream { --tape: var(--tape-butter); --fg: var(--cream-fg); }
.stat.lav   { --tape: var(--tape-lilac);  --fg: var(--lav-fg); }
.stat.mint  { --tape: var(--tape-mint);   --fg: var(--mint-fg); }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: flex-start; gap: 10px; padding: 22px 24px 14px; }
.panel-h h2 { font-family: var(--f-title); font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.panel-h p { margin: 2px 0 0; font-size: 12px; color: var(--faint); }
.panel-h .r { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.panel-b { padding: 4px 24px 22px; }
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.dash-col { display: grid; gap: 22px; min-width: 0; }
.dash-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 24px 14px; }
.tabs button { height: 32px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12.5px; }
.tabs button[aria-pressed="true"] { background: var(--ink-h); border-color: var(--ink-h); color: var(--surface); font-weight: 700; }

/* status pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--pb); color: var(--pf); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.t-plan  { --pb: var(--sand-bg);  --pf: var(--sand-fg);  --pd: var(--sand-bd); }
.t-doing { --pb: var(--rose-bg);  --pf: var(--rose-fg);  --pd: var(--rose-bd); }
.t-nomi  { --pb: var(--lav-bg);   --pf: var(--lav-fg);   --pd: var(--lav-bd); }
.t-ready { --pb: var(--cream-bg); --pf: var(--cream-fg); --pd: var(--cream-bd); }
.t-visa  { --pb: var(--sky-bg);   --pf: var(--sky-fg);   --pd: var(--sky-bd); }
.t-done  { --pb: var(--mint-bg);  --pf: var(--mint-fg);  --pd: var(--mint-bd); }
.t-hold  { --pb: var(--grey-bg);  --pf: var(--grey-fg);  --pd: var(--grey-bd); }
.t-drop  { --pb: var(--red-bg);   --pf: var(--red-fg);   --pd: var(--red-bd); }
.st-sel { appearance: none; -webkit-appearance: none; border: 1.5px solid transparent; border-radius: 999px; padding: 4px 28px 4px 12px; font-size: 12px; font-weight: 600; background-color: var(--pb); color: var(--pf);
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 10px) 52%; background-size: 4px 4px; background-repeat: no-repeat; }
.st-sel:hover { border-color: var(--pd); }
.st-sel option { background: var(--surface); color: var(--ink); }

/* avatars + partner tags */
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-it); font-style: italic; font-weight: 500; font-size: 13px; flex: none; }
.av1 { background: var(--av1); color: var(--av1-fg); } .av2 { background: var(--av2); color: var(--av2-fg); } .av3 { background: var(--av3); color: var(--av3-fg); }
.av4 { background: var(--av4); color: var(--av4-fg); } .av5 { background: var(--av5); color: var(--av5-fg); }
.who { display: flex; align-items: center; gap: 11px; min-width: 0; }
.who b { display: block; font-weight: 700; color: var(--ink-h); white-space: nowrap; font-size: 13.5px; }
.who small { display: block; font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; color: var(--pc); background: var(--pcb); border-radius: 999px; padding: 2px 10px 2px 8px; font-weight: 600; }
.ptag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p1 { --pc: var(--rose-fg); --pcb: var(--rose-bg); } .p2 { --pc: var(--lav-fg); --pcb: var(--lav-bg); }
.p3 { --pc: var(--cream-fg); --pcb: var(--cream-bg); } .p4 { --pc: var(--mint-fg); --pcb: var(--mint-bg); }
.scope { font-family: var(--f-it); font-style: italic; font-size: 12px; color: var(--muted); white-space: nowrap; }

/* tables */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); color: var(--muted); font-weight: 500; font-size: 12px; text-align: left; padding: 10px 14px; border-top: 1px dashed var(--line-strong); border-bottom: 1px dashed var(--line-strong); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { padding-left: 24px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 24px; }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; color: var(--ink-2); }
.tbl tbody tr { cursor: pointer; transition: background .12s; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tbody tr.is-sel td { background: var(--primary-soft); }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl th button { background: none; border: 0; padding: 0; color: inherit; font: inherit; display: inline-flex; gap: 4px; align-items: center; }
.tbl th button[aria-sort="ascending"]::after { content: "↑"; color: var(--primary); }
.tbl th button[aria-sort="descending"]::after { content: "↓"; color: var(--primary); }
.tbl .clip { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl .nowrap { white-space: nowrap; }
.tbl .none { color: var(--faint); }
.tbl .nm { font-weight: 700; color: var(--ink-h); }
.tbl .sub { display: block; font-size: 12px; color: var(--faint); font-weight: 400; }
.row-act { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); color: var(--primary); display: grid; place-items: center; }
.row-act svg { width: 13px; height: 13px; }

/* bars */
.hbars { display: grid; gap: 11px; }
.hbar { display: grid; grid-template-columns: 104px minmax(0, 1fr) 34px; gap: 12px; align-items: center; background: none; border: 0; padding: 1px 0; text-align: left; font-size: 13px; color: var(--ink-2); }
.hbar .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .t { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hbar .t i { display: block; height: 100%; border-radius: 99px; background: var(--pf, var(--primary)); opacity: .55; min-width: 5px; }
.hbar .v { text-align: right; font-family: var(--f-it); font-style: italic; font-size: 16px; color: var(--ink-h); font-variant-numeric: lining-nums; }
.hbar:hover .n { color: var(--primary-ink); }

.ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ptable th { font-weight: 500; font-size: 11.5px; color: var(--faint); text-align: right; padding: 0 6px 8px; }
.ptable th:first-child { text-align: left; padding-left: 0; }
.ptable td { padding: 10px 6px; border-top: 1px dashed var(--line-strong); text-align: right; font-family: var(--f-it); font-style: italic; font-size: 16px; color: var(--ink-h); font-variant-numeric: lining-nums; }
.ptable td:first-child { text-align: left; font-family: var(--f-body); font-style: normal; font-size: 13px; padding-left: 0; }
.ptable tbody tr { cursor: pointer; }
.ptable tbody tr:hover td { background: var(--surface-2); }

/* timeline */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 34px 14px minmax(0, 1fr); gap: 12px; align-items: start; position: relative; }
.timeline li button { all: unset; display: contents; cursor: pointer; }
.timeline .n { font-family: var(--f-it); font-style: italic; font-size: 19px; line-height: 1.2; color: var(--ink-h); text-align: right; font-variant-numeric: lining-nums; }
.timeline .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--pf); margin-top: 6px; position: relative; z-index: 1; justify-self: center; }
.timeline li:not(:last-child)::after { content: ""; position: absolute; left: calc(34px + 12px + 6px); top: 21px; bottom: -4px; border-left: 1.5px dashed var(--line-strong); }
.timeline .tx { padding-bottom: 15px; }
.timeline .tx b { display: block; font-size: 13px; color: var(--ink-h); font-weight: 700; }
.timeline .tx small { display: block; font-size: 12px; color: var(--faint); }
.timeline li:hover .tx b { color: var(--primary-ink); }

/* attention */
.todo { list-style: none; margin: 0; padding: 0; display: grid; }
.todo li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px dashed var(--line-strong); }
.todo li:first-child { border-top: 0; }
.todo .ck { width: 20px; height: 20px; border-radius: 50%; background: var(--rose-bg); flex: none; margin-top: 1px; display: grid; place-items: center; color: var(--rose-fg); font-size: 11px; font-weight: 700; }
.todo button { background: none; border: 0; padding: 0; text-align: left; font-size: 13px; font-weight: 700; color: var(--ink-h); }
.todo button:hover { color: var(--primary-ink); }
.todo small { display: block; font-size: 12px; color: var(--rose-fg); }
.count-chip { min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; background: var(--rose-bg); color: var(--rose-fg); font-family: var(--f-it); font-style: italic; font-size: 15px; display: grid; place-items: center; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; }
.feed li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--line-strong); }
.feed li:first-child { border-top: 0; }
.feed .meta { margin-left: auto; text-align: right; font-size: 12px; color: var(--faint); white-space: nowrap; }
.feed button { all: unset; cursor: pointer; display: contents; }
.empty-state { padding: 36px 18px; text-align: center; color: var(--muted); font-size: 13px; }
.empty-state b { display: block; color: var(--ink-h); font-size: 16px; margin-bottom: 4px; font-family: var(--f-title); }

/* ---------- page head + toolbars ---------- */
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 6px 4px 0; }
.pagehead h1 { font-family: var(--f-title); font-size: 30px; font-weight: 700; margin: 2px 0 4px; letter-spacing: -.02em; }
.pagehead p { margin: 0; color: var(--muted); max-width: 70ch; }
.pagehead .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 18px 24px; }
.toolbar + .toolbar { padding-top: 0; }
.search { position: relative; flex: 1 1 240px; min-width: 0; max-width: 340px; }
.search svg { position: absolute; left: 14px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--primary); }
.search input { width: 100%; height: 40px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface-2); padding: 0 14px 0 38px; outline: none; font-size: 13px; }
.search input:focus, .selbox:focus { border-color: var(--primary-line); background: var(--surface); box-shadow: 0 0 0 4px var(--primary-soft); }
.selbox { height: 40px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface-2); padding: 0 14px; outline: none; max-width: 100%; font-size: 13px; }
.checks { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.checks .lbl { font-family: var(--f-it); font-style: italic; font-size: 14px; color: var(--eyebrow); margin-right: 4px; }
.ck-chip { display: inline-flex; align-items: center; gap: 9px; height: 38px; padding: 0 15px 0 12px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; color: var(--muted); user-select: none; transition: background .15s, border-color .15s; }
.ck-chip input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; margin: 0; border: 1.5px solid var(--line-strong); border-radius: 50%; background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.ck-chip input::after { content: ""; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
.ck-chip input:checked { background: var(--pc, var(--primary)); border-color: var(--pc, var(--primary)); }
.ck-chip input:checked::after { opacity: 1; }
.ck-chip:has(input:checked) { color: var(--ink-h); font-weight: 600; background: var(--pcb, var(--primary-soft)); border-color: transparent; }
.ck-chip input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ck-chip .c { font-family: var(--f-it); font-style: italic; font-size: 13px; color: var(--muted); font-weight: 400; }
.count-line { font-size: 12.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.count-line b { color: var(--ink-h); font-family: var(--f-it); font-style: italic; font-weight: 500; font-size: 18px; }

/* ---------- pipeline ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding: 0 24px 24px; align-items: start; }
.kcol { background: var(--pb); border: 1.5px dashed var(--pd); border-radius: 22px; min-height: 150px; display: grid; align-content: start; transition: border-color .15s, box-shadow .15s; }
.kcol.over { border-style: solid; border-color: var(--pf); box-shadow: 0 0 0 4px var(--surface), 0 0 0 6px var(--pd); }
.kcol-h { padding: 14px 16px 10px; display: grid; gap: 2px; }
.kcol-h .row { display: flex; align-items: center; gap: 8px; }
.kcol-h .row .pill { background: var(--surface); }
.kcol-h .row b { margin-left: auto; font-family: var(--f-it); font-style: italic; font-weight: 500; font-size: 20px; color: var(--pf); }
.kcol-h small { font-size: 11.5px; color: var(--ink-2); opacity: .75; }
.kcards { display: grid; gap: 10px; padding: 0 10px 12px; }
.kcard { background: var(--surface); border-radius: 16px; padding: 13px; display: grid; gap: 8px; cursor: grab; box-shadow: var(--shadow-sm); transition: transform .12s, box-shadow .12s; }
.kcard:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.kcard.dragging { opacity: .45; }
.kcard .top { display: flex; align-items: center; gap: 8px; }
.kcard .top .num { font-family: var(--f-it); font-style: italic; font-size: 12px; color: var(--faint); margin-left: auto; }
.kcard .rt { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.kcard .rt .none { color: var(--faint); }
.kcard .nx { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 6px 9px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kcard .ft { display: flex; align-items: center; gap: 8px; }
.kempty { font-size: 12px; color: var(--ink-2); opacity: .7; padding: 6px 4px 10px; text-align: center; }

/* ---------- companies ---------- */
.split { display: grid; grid-template-columns: minmax(0, 430px) minmax(0, 1fr); gap: 22px; align-items: start; }
.split .list { max-height: calc(100vh - 260px); overflow: auto; border-radius: 0 0 24px 24px; }
.co-mark { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-it); font-style: italic; font-weight: 500; font-size: 13px; flex: none; }
.tag { font-size: 11px; border-radius: 999px; padding: 2px 9px; white-space: nowrap; font-weight: 600; background: var(--grey-bg); color: var(--grey-fg); }
.tag.ok { background: var(--mint-bg); color: var(--mint-fg); }
.tag.warn { background: var(--rose-bg); color: var(--rose-fg); }
.detail-h { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.detail-h .co-mark { width: 52px; height: 52px; border-radius: 18px; font-size: 17px; }
.detail-h h2 { font-family: var(--f-title); font-size: 23px; margin: 0; overflow-wrap: anywhere; }
.detail-h .r { margin-left: auto; display: flex; gap: 8px; }
.mini-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mini-stats div { border-radius: 16px; padding: 12px 14px; background: var(--bgc); }
.mini-stats span { display: block; font-size: 12px; color: var(--ink-2); }
.mini-stats b { font-family: var(--f-it); font-style: italic; font-weight: 500; font-size: 26px; color: var(--ink-h); font-variant-numeric: lining-nums; }
.info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; margin: 0; padding: 18px 20px; border-radius: 18px; background: var(--surface-2); border: 1.5px dashed var(--line-strong); }
.info-grid div { min-width: 0; }
.info-grid dt { font-size: 11.5px; color: var(--eyebrow); }
.info-grid dd { margin: 2px 0 0; overflow-wrap: anywhere; user-select: text; color: var(--ink-h); font-size: 13.5px; }
.info-grid dd.empty { color: var(--faint); }
.info-grid .full { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; background: var(--lav-bg); color: var(--lav-fg); font-weight: 600; }
.chip .num { font-family: var(--f-it); font-style: italic; }
.sec-t { font-family: var(--f-title); font-size: 15px; font-weight: 700; color: var(--ink-h); margin: 0 0 10px; }
.stack { display: grid; gap: 18px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; backdrop-filter: blur(3px); }
.drawer { position: fixed; top: 14px; right: 14px; bottom: 14px; width: min(540px, calc(100% - 28px)); z-index: 41; background: var(--surface); border-radius: 28px; box-shadow: 0 30px 70px -20px rgba(120, 50, 80, .35); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; animation: slide .22s ease; overflow: hidden; }
@keyframes slide { from { transform: translateX(24px); opacity: .5; } }
.drawer-h {
  display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 22px) 26px 18px;
  background-color: var(--gingham-bg);
  background-image: linear-gradient(90deg, var(--gingham) 50%, transparent 50%), linear-gradient(var(--gingham) 50%, transparent 50%);
  background-size: 20px 20px;
}
.drawer-h .av, .drawer-h .co-mark { width: 46px; height: 46px; font-size: 15px; box-shadow: 0 0 0 3px var(--surface); }
.drawer-h h2 { margin: 0; font-family: var(--f-title); font-size: 21px; }
.drawer-h p { margin: 1px 0 0; font-size: 12px; color: var(--ink-2); }
.drawer-b { overflow-y: auto; padding: 22px 26px; display: grid; gap: 14px; align-content: start; }
.drawer-f { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 14px 26px calc(env(safe-area-inset-bottom, 0px) + 14px); border-top: 1.5px dashed var(--line-strong); }
.drawer-f .grow { flex: 1; }
.x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); color: var(--primary-ink); display: grid; place-items: center; flex: none; box-shadow: var(--shadow-sm); }
.x svg { width: 14px; height: 14px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.full { grid-column: 1 / -1; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .fl { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 9px 13px; outline: none; font-size: 13.5px; }
.field textarea { resize: vertical; min-height: 64px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary-line); background: var(--surface); box-shadow: 0 0 0 4px var(--primary-soft); }
.field input:disabled, .field select:disabled, .field textarea:disabled { color: var(--ink-2); }
.req { color: var(--primary); }
.seg2 { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.seg2 label { display: inline-flex; align-items: center; padding: 8px 15px; cursor: pointer; font-size: 13px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.seg2 input { position: absolute; opacity: 0; pointer-events: none; }
.seg2 label:has(input:checked) { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary-ink); font-weight: 700; }
.seg2 label:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1.5px dashed var(--red-bd); background: var(--red-bg); border-radius: 16px; padding: 11px 14px; font-size: 13px; color: var(--ink-2); }
.confirm span { flex: 1 1 200px; }
.hint { font-size: 12.5px; color: var(--ink-2); margin: 0; background: var(--lav-bg); border-radius: 14px; padding: 9px 13px; }
.err { font-size: 13px; color: var(--red-fg); margin: 0; }
.meta-line { font-size: 12px; color: var(--faint); }

/* click-to-copy + dates */
.copy { display: inline-flex; align-items: center; gap: 6px; max-width: 250px; border: 1.5px dashed var(--line-strong); background: var(--surface); border-radius: 999px; padding: 3px 11px 3px 9px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.copy span { overflow: hidden; text-overflow: ellipsis; }
.copy svg { width: 13px; height: 13px; color: var(--primary); flex: none; }
.copy:hover { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary-ink); }
.copy.done { background: var(--mint-bg); border-color: var(--mint-bd); color: var(--mint-fg); }
.copy.done svg { color: var(--mint-fg); }
.kcard .ph { display: flex; min-width: 0; }
.kcard .ph .copy { max-width: 100%; cursor: pointer; }
.date { font-family: var(--f-it); font-style: italic; font-size: 13.5px; color: var(--ink-h); white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
.tbl.stick th:first-child, .tbl.stick td:first-child { position: sticky; left: 0; z-index: 2; background: var(--surface); }
.tbl.stick th:first-child { z-index: 3; background: var(--surface-2); }
.contact-card { border-radius: 18px; background: var(--surface-2); border: 1.5px dashed var(--line-strong); padding: 14px 16px; display: grid; gap: 12px; }
.contact-card .cc-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.contact-card .cc-row .none { font-size: 12.5px; color: var(--faint); }
.dates4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.dates4 div { background: var(--surface); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.dates4 span { display: block; font-size: 11.5px; color: var(--eyebrow); }
.dates4 b { font-family: var(--f-it); font-style: italic; font-weight: 500; font-size: 14px; color: var(--ink-h); font-variant-numeric: lining-nums; }
.dates4 b.empty { color: var(--faint); font-family: var(--f-body); font-style: normal; font-size: 12.5px; font-weight: 400; }
.sec-label { grid-column: 1 / -1; font-family: var(--f-it); font-style: italic; color: var(--eyebrow); font-size: 14px; border-top: 1.5px dashed var(--line-strong); padding-top: 12px; margin-top: 2px; }
@media (max-width: 640px) { .dates4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* receivables (수금 관리) */
.p5 { --pc: var(--sky-fg); --pcb: var(--sky-bg); }
.amt { font-family: var(--f-it); font-style: italic; font-weight: 500; font-variant-numeric: lining-nums tabular-nums; color: var(--ink-h); white-space: nowrap; }
.amt.out { color: var(--rose-fg); }
.amt.zero { color: var(--faint); }
.bill-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.bill { position: relative; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 20px; padding: 16px 18px; display: grid; gap: 6px; box-shadow: var(--shadow-sm); transition: transform .15s, border-color .15s, background .15s; color: inherit; }
.bill:hover { transform: translateY(-2px); }
.bill[aria-pressed="true"] { border-color: var(--pc); background: var(--pcb); }
.bill[aria-pressed="false"].dim { opacity: .55; }
.bill .top { display: flex; align-items: center; gap: 8px; }
.bill .top .n { margin-left: auto; font-size: 12px; color: var(--muted); }
.bill strong { font-family: var(--f-it); font-style: italic; font-weight: 500; font-size: 26px; line-height: 1.15; color: var(--ink-h); font-variant-numeric: lining-nums; }

        <label for="iv-amount">공급가액 (AUD) <span class="req">*</span></label>
        <input id="iv-amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="10000">
      </div>
      <div class="field">
        <span class="fl">GST</span>
        <label class="ck-line"><input type="checkbox" id="iv-gst" checked> GST 10% 별도 청구</label>
      </div>
      <div class="inv-total"><span>청구 금액</span><b id="ivTotal">$0</b></div>
      <div class="field">
        <label for="iv-issued">발행일</label>
        <input id="iv-issued" type="date">
      </div>
      <div class="field">
        <label for="iv-due">입금 예정일</label>
        <input id="iv-due" type="date">
      </div>
      <div class="field">
        <label for="iv-status">상태</label>
        <select id="iv-status"></select>
      </div>
      <div class="field">
        <label for="iv-paid">입금된 금액 (AUD)</label>
        <input id="iv-paid" type="number" min="0" step="0.01" inputmode="decimal" placeholder="부분 입금일 때만">
      </div>
      <div class="field">
        <label for="iv-paidDate">입금일</label>
        <input id="iv-paidDate" type="date">
      </div>
      <div class="field full">
        <label for="iv-memo">메모</label>
        <textarea id="iv-memo" rows="2" placeholder="인보이스 번호, 입금 약속, 특이사항 등"></textarea>
      </div>
    </div>
    <div class="confirm" id="ivConfirm" hidden>
      <span>이 인보이스 기록을 삭제할까요? 되돌릴 수 없어요.</span>
      <button class="btn sm" type="button" id="ivConfirmNo">취소</button>
      <button class="btn sm danger solid" type="button" id="ivConfirmYes">삭제</button>
    </div>
    <p class="err" id="ivErr" hidden></p>
  </div>
  <div class="drawer-f">
    <button class="btn danger sm" type="button" id="ivDel" hidden>삭제</button>
    <button class="linkbtn" type="button" id="ivOpenClient" hidden>고객 정보 보기</button>
    <span class="meta-line grow" id="ivMeta"></span>
    <button class="btn sm" type="button" data-close="inv">취소</button>
    <button class="btn primary sm" type="submit" id="ivSave">저장</button>
  </div>
</form>
<datalist id="dl-clients"></datalist>
<datalist id="dl-job"></datalist>
<datalist id="dl-ohla"></datalist>
<datalist id="dl-host"></datalist>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  /* ================= constants ================= */
  const STATUS = [
    { k: '진행 예정',     c: 't-plan',  g: 'active', d: '계약·서류 준비 전' },
    { k: '진행 중',       c: 't-doing', g: 'active', d: 'Host 매칭·서류 준비' },
    { k: '노미승인대기',   c: 't-nomi',  g: 'active', d: '노미네이션 접수, 심사 중' },
    { k: '482신청대기',    c: 't-ready', g: 'active', d: '노미 승인, 482 접수 전' },
    { k: '482대기',       c: 't-visa',  g: 'active', d: '482 비자 심사 중' },
    { k: '진행완료',       c: 't-done',  g: 'done',   d: '업무 완료' },
    { k: '보류',          c: 't-hold',  g: 'hold',   d: '진행 일시 중단' },
    { k: '482철회',       c: 't-drop',  g: 'drop',   d: '482 신청 철회' },
    { k: '노미네이션철회',  c: 't-drop',  g: 'drop',   d: '노미네이션 철회' },
  ];
  const SM = Object.fromEntries(STATUS.map((s, i) => [s.k, { ...s, i }]));
  const PARTNERS = ['ANS', '다니엘', '멜리사', '스실'];
  const PLABEL = { ANS: 'ANS 고객', '다니엘': '다니엘 고객', '멜리사': '멜리사 고객', '스실': '스실 고객' };
  const PCLS = { ANS: 'p1', '다니엘': 'p2', '멜리사': 'p3', '스실': 'p4' };
  const NOMI_OK = new Set(['482신청대기', '482대기', '진행완료', '482철회']);
  const VISA = 'NOMI + VISA';
  const ROUTES = [
    ['dashboard', '대시보드', 'i-home'],
    ['pipeline', '진행고객 관리', 'i-board'],
    ['ohla', 'OHLA 업체 관리', 'i-building'],
    ['hosts', 'Host Company 관리 및 정보', 'i-brief'],
    ['clients', '총 고객', 'i-users'],
    ['money', '수금 관리', 'i-coin'],
  ];
  const KIND = {
    ohla:  { col: 'ohla',  field: 'ohla', other: 'host', label: 'OHLA 업체',    none: 'OHLA 미확인', otherLabel: 'Host Company' },
    hosts: { col: 'hosts', field: 'host', other: 'ohla', label: 'Host Company', none: 'Host 미정',   otherLabel: 'OHLA 업체' },
  };
  const NONE_KEY = '__none__';
  const LOCAL_KEY = 'ans-portal-local-v2';
  const PREF_KEY = 'ans-portal-prefs-v3';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const keyOf = (s) => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const icon = (id, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

  /* ================= state ================= */
  const state = {
    clients: [], ohla: [], hosts: [], invoices: [],
    money: { biller: 'all', view: 'open', q: '' },
    editInv: null,
    mode: 'loading', canWrite: true,
    route: 'dashboard',
    dashTab: 'all',
    roster: { partners: [...PARTNERS], q: '', status: 'all', ohla: 'all', sortKey: 'no', sortDir: 1 },
    pipe: { q: '', partners: [...PARTNERS], showClosed: false },
    comp: { ohla: { q: '', sel: null }, hosts: { q: '', sel: null } },
    editClient: null, editComp: null,
  };
  try {
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    if (p.roster) Object.assign(state.roster, p.roster);
    if (p.pipe) Object.assign(state.pipe, p.pipe);
  } catch (e) {}
  const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify({ roster: state.roster, pipe: state.pipe })); } catch (e) {} };

  let db = null, user = null, downloads = null, myId = null, myName = '';

  /* ================= derived ================= */
  const grp = (c) => (SM[c.status] || {}).g || 'active';
  const isNomi = (c) => !!c.nomiGranted;
  const isVisa = (c) => !!c.visaGranted;
  const isDrop = (c) => (SM[c.status] || {}).g === 'drop';
  const partnerOf = (c) => (PARTNERS.includes(c.partner) ? c.partner : 'ANS');
  function stats(list) {
    const s = { total: list.length, active: 0, done: 0, hold: 0, drop: 0, nomi: 0, visa: 0 };
    list.forEach((c) => { s[grp(c)]++; if (isNomi(c)) s.nomi++; if (isVisa(c)) s.visa++; });
    return s;
  }
  const countBy = (list, k) => list.filter((c) => c.status === k).length;
  function companies(kind) {
    const { field } = KIND[kind];
    const map = new Map();
    for (const d of state[kind]) { const k = keyOf(d.name); if (k && !map.has(k)) map.set(k, { key: k, name: d.name, doc: d, clients: [] }); }
    for (const c of state.clients) {
      const v = (c[field] || '').trim(); if (!v) continue;
      const k = keyOf(v);
      if (!map.has(k)) map.set(k, { key: k, name: v, doc: null, clients: [] });
      map.get(k).clients.push(c);
    }
    return [...map.values()].sort((a, b) => b.clients.length - a.clients.length || a.name.localeCompare(b.name));
  }

  /* ================= small renderers ================= */
  const hash = (s) => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
  function initials(name) {
    const n = String(name || '').trim();
    if (!n) return '?';
    if (/[가-힣]/.test(n)) return n.length >= 3 ? n.slice(1, 3) : n.slice(0, 2);
    const [sur, given = ''] = n.split(',');
    const a = (sur.trim()[0] || ''), b = (given.trim()[0] || sur.trim()[1] || '');
    return (a + b).toUpperCase();
  }
  const avatar = (name) => `<span class="av av${(hash(name) % 5) + 1}" aria-hidden="true">${esc(initials(name))}</span>`;
  const coMark = (name) => `<span class="co-mark av${(hash(name) % 5) + 1}" aria-hidden="true">${esc(String(name || '?').replace(/[^A-Za-z0-9가-힣]/g, '').slice(0, 2).toUpperCase() || '?')}</span>`;
  const pill = (status) => { const s = SM[status]; return `<span class="pill ${s ? s.c : 't-plan'}">${esc(status || '미정')}</span>`; };
  const ptag = (p) => `<span class="ptag ${PCLS[p] || 'p1'}">${esc(p)}</span>`;
  const dash = (v, none) => (v ? esc(v) : `<span class="none">${esc(none || '—')}</span>`);
  function timeAgo(iso) {
    const t = Date.parse(iso); if (!t) return '';
    const d = (Date.now() - t) / 1000;
    if (d < 60) return '방금';
    if (d < 3600) return Math.floor(d / 60) + '분 전';
    if (d < 86400) return Math.floor(d / 3600) + '시간 전';
    if (d < 86400 * 7) return Math.floor(d / 86400) + '일 전';
    const x = new Date(t); return `${x.getFullYear()}. ${String(x.getMonth() + 1).padStart(2, '0')}. ${String(x.getDate()).padStart(2, '0')}`;
  }
  const touched = (c) => !!c.updatedBy || c.source !== 'excel';
  const who = (c) => (c.updatedBy ? `<span data-uid="${esc(c.updatedBy)}">직원</span>` : '');
  const statusOptions = (cur) => STATUS.map((s) => `<option value="${esc(s.k)}"${s.k === cur ? ' selected' : ''}>${esc(s.k)}</option>`).join('');
  const statusSelect = (c) => {
    const s = SM[c.status];
    return state.canWrite
      ? `<select class="st-sel ${s ? s.c : 't-plan'}" id="st-${esc(c.id)}" data-status-of="${esc(c.id)}" aria-label="${esc(c.name)} 진행 상태">${statusOptions(c.status)}</select>`
      : pill(c.status);
  };
  const fmtDate = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '')); return m ? `${m[1]}.${m[2]}.${m[3]}` : ''; };
  const dateCell = (iso) => (fmtDate(iso) ? `<span class="date">${fmtDate(iso)}</span>` : '<span class="none">—</span>');
  const copyBtn = (v, label) => (v
    ? `<button type="button" class="copy" data-copy="${esc(v)}" data-copy-label="${esc(label)}" title="클릭해서 ${esc(label)} 복사">${icon('i-copy', '')}<span>${esc(v)}</span></button>`
    : '<span class="none">—</span>');
  const DATE_FIELDS = [['nomiApplied', '노미 신청'], ['nomiGranted', '노미 승인'], ['visaApplied', '비자 신청'], ['visaGranted', '비자 승인']];
  const whoCell = (c) => `<div class="who">${avatar(c.name)}<div style="min-width:0"><b>${esc(c.name)}</b><small>${esc(c.job || '직군 미입력')}</small></div></div>`;

  async function fillNames() {
    if (!user) return;
    const els = [...document.querySelectorAll('[data-uid]')];
    if (!els.length) return;
    const ps = await user.profiles([...new Set(els.map((e) => e.dataset.uid))]);
    els.forEach((e) => { const p = ps[e.dataset.uid]; e.textContent = (p && p.name) || '직원'; });
  }

  /* ================= chrome ================= */
  function renderChrome() {
    const all = state.clients;
    const counts = { pipeline: stats(all).active, clients: all.length, ohla: companies('ohla').length, hosts: companies('hosts').length, money: state.invoices.filter(isOpen).length };
    $('nav').innerHTML = ROUTES.map(([r, label, ic]) => `<a href="#${r}" data-route="${r}"${state.route === r ? ' aria-current="page"' : ''}>${icon(ic)}<span>${label}</span>${state.mode !== 'loading' && counts[r] ? `<span class="cnt">${counts[r]}</span>` : ''}</a>`).join('');
    const live = $('live');
    live.className = 'live' + (state.mode === 'live' ? ' on' : state.mode === 'local' ? ' local' : '');
    live.lastElementChild.textContent = state.mode === 'live' ? (state.canWrite ? '실시간 동기화 중' : '보기 전용') : state.mode === 'local' ? '로컬 미리보기' : '연결 중';
    $('addBtn').hidden = !state.canWrite || state.mode === 'loading';
    const now = new Date();
    $('topDate').textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${'일월화수목금토'[now.getDay()]}요일`;
  }

  /* ================= views ================= */
  const V = {};

  /* ---------- dashboard ---------- */
  V.dashboard = {
    mount() {
      return `
      <section class="hero" aria-labelledby="heroTitle">
        <div class="hero-card">
          <svg class="bow" aria-hidden="true"><use href="#bow"/></svg>
          <svg class="spark s1" aria-hidden="true"><use href="#i-spark"/></svg>
          <svg class="spark s2" aria-hidden="true"><use href="#i-spark"/></svg>
          <div style="min-width:0">
            <div class="eyebrow" id="heroEyebrow">Visa progress board</div>
            <h1 id="heroTitle">비자 진행고객 현황</h1>
            <p id="heroText">고객 데이터를 불러오는 중이에요.</p>
          </div>
          <div class="hero-acts">
            <button class="btn" type="button" data-go="pipeline">진행고객 관리</button>
            <button class="btn primary" type="button" data-act="add-client" id="heroAdd">${icon('i-plus')}새 고객 등록</button>
          </div>
        </div>
        <div class="stats" id="dStats"></div>
      </section>
      <div class="dash">
        <div class="dash-col">
          <section class="panel">
            <div class="panel-h"><div><h2>최근 비자 진행 현황</h2><p>최근 수정된 순서로 보여드려요</p></div>
              <div class="r"><button class="linkbtn" type="button" data-go="clients">전체보기 ${icon('i-chev')}</button></div></div>
            <div class="tabs" id="dTabs"></div>
            <div class="tbl-wrap"><table class="tbl" id="dRecent"></table></div>
          </section>
          <div class="dash-2">
            <section class="panel">
              <div class="panel-h"><div><h2>진행 상태별 분포</h2><p>누르면 해당 고객 목록으로 이동해요</p></div></div>
              <div class="panel-b"><div class="hbars" id="dStatus"></div></div>
            </section>
            <section class="panel">
              <div class="panel-h"><div><h2>담당별 현황</h2><p>승인 = 승인일이 입력된 고객</p></div></div>
              <div class="panel-b"><table class="ptable" id="dPartner"></table></div>
            </section>
          </div>
          <div class="dash-2">
            <section class="panel">
              <div class="panel-h"><div><h2>OHLA 업체별</h2><p>업체별 고객 수</p></div><div class="r"><button class="linkbtn" type="button" data-go="ohla">관리 ${icon('i-chev')}</button></div></div>
              <div class="panel-b"><div class="hbars" id="dOhla"></div></div>
            </section>
            <section class="panel">
              <div class="panel-h"><div><h2>Host Company 상위</h2><p>고객이 많은 순서</p></div><div class="r"><button class="linkbtn" type="button" data-go="hosts">전체보기 ${icon('i-chev')}</button></div></div>
              <div class="panel-b"><div class="hbars" id="dHost"></div></div>
            </section>
          </div>
        </div>
        <div class="dash-col dash-side" style="display:grid;gap:20px">
          <section class="panel">
            <div class="panel-h"><div><h2>수금 현황</h2><p>발행 후 아직 입금되지 않은 금액</p></div><div class="r"><button class="icon-btn" type="button" data-go="money" aria-label="수금 관리로 이동">${icon('i-chev')}</button></div></div>
            <div class="panel-b" style="display:grid;gap:12px"><div class="total-box"><span id="dRecvN">미수금</span><b id="dRecvSum">$0</b></div><ul class="recv-list" id="dRecv"></ul></div>
          </section>
          <section class="panel">
            <div class="panel-h"><div><h2>단계별 진행</h2><p>노미네이션부터 482 승인까지</p></div><div class="r"><button class="icon-btn" type="button" data-go="pipeline" aria-label="진행고객 관리로 이동">${icon('i-chev')}</button></div></div>
            <div class="panel-b"><ol class="timeline" id="dStages"></ol></div>
          </section>
          <section class="panel">
            <div class="panel-h"><div><h2>놓치면 안 돼요!</h2><p>정보가 비어 있는 진행 중 고객</p></div><div class="r"><span class="count-chip" id="dAttnN">0</span></div></div>
            <div class="panel-b"><ul class="todo" id="dAttn"></ul></div>
          </section>
          <section class="panel">
            <div class="panel-h"><div><h2>최근 업데이트</h2><p>직원이 수정한 내역</p></div></div>
            <div class="panel-b"><ul class="feed" id="dFeed"></ul></div>
          </section>
        </div>
      </div>`;
    },
    update() {
      const all = state.clients, s = stats(all);
      const now = new Date();
      $('heroEyebrow').textContent = `Visa progress board · ${now.getFullYear()}. ${String(now.getMonth() + 1).padStart(2, '0')}. ${String(now.getDate()).padStart(2, '0')}`;
      $('heroAdd').hidden = !state.canWrite || state.mode === 'loading';
      if (state.mode === 'loading') { $('dStats').innerHTML = ''; return; }
      $('heroText').innerHTML = all.length
        ? `진행 중인 고객 <b>${s.active}명</b> · 노미 심사 <b>${countBy(all, '노미승인대기')}명</b> · 482 심사 <b>${countBy(all, '482대기')}명</b> · 482 신청 대기 <b>${countBy(all, '482신청대기')}명</b>`
        : '아직 등록된 고객이 없어요. 새 고객 등록으로 시작해 보세요.';

      const ansN = all.filter((c) => partnerOf(c) === 'ANS').length;
      $('dStats').innerHTML = [
        ['rose', 'i-users', '전체 고객', s.total, `ANS ${ansN} · 파트너 ${s.total - ansN}`, 'all'],
        ['cream', 'i-file', '진행 중·대기', s.active, `482 신청 대기 ${countBy(all, '482신청대기')}명`, 'g:active'],
        ['lav', 'i-clock', '노미 승인', s.nomi, '노미 승인일이 입력된 고객', 'nomi'],
        ['mint', 'i-check', '482 승인', s.visa, `진행완료 ${s.done}명 중`, 'visa'],
      ].map(([cls, ic, l, v, sub, f]) => `<button class="stat ${cls}" type="button" data-roster-status="${f}">
        <span class="lbl">${icon(ic)}${l}</span><strong>${v}<small>명</small></strong><span class="sub">${esc(sub)}</span></button>`).join('');

      // recent table with tabs
      const tabs = [['all', '전체'], ['노미승인대기', '노미승인대기'], ['482신청대기', '482신청대기'], ['482대기', '482대기'], ['진행완료', '진행완료']];
      $('dTabs').innerHTML = tabs.map(([k, l]) => `<button type="button" data-dtab="${esc(k)}" aria-pressed="${state.dashTab === k}">${l}</button>`).join('');
      const recent = all.filter((c) => state.dashTab === 'all' || c.status === state.dashTab)
        .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')) || (b.no || 0) - (a.no || 0)).slice(0, 6);
      $('dRecent').innerHTML = `<thead><tr><th>고객명</th><th>담당</th><th>OHLA → Host</th><th>진행 상태</th><th>최근 수정</th><th></th></tr></thead><tbody>` +
        (recent.length ? recent.map((c) => `<tr data-open-client="${esc(c.id)}" tabindex="0"><td>${whoCell(c)}</td><td>${ptag(partnerOf(c))}</td>
          <td class="clip" style="max-width:240px">${dash(c.ohla, '미확인')} → ${dash(c.host, '미정')}</td><td>${pill(c.status)}</td>
          <td class="nowrap muted">${touched(c) ? esc(timeAgo(c.updatedAt)) : '엑셀 원본'}</td><td class="r"><span class="row-act">${icon('i-chev', '')}</span></td></tr>`).join('')
          : `<tr><td colspan="6"><div class="empty-state">해당 상태의 고객이 없어요.</div></td></tr>`) + '</tbody>';

  function invOut(i) { return i.status === 'paid' ? 0 : Math.max(0, invTotal(i) - (Number(i.paid) || 0)); }

  /* ---------- filter helpers ---------- */
  function matchText(c, q) {
    if (!q) return true;
    const hay = [c.no, c.name, c.job, c.ohla, c.host, c.status, c.scope, c.partner, c.memo, c.next, c.check, c.phone, c.email].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
  }
  function matchStatus(c, s) {
    if (s === 'all') return true;
    if (s === 'nomi') return isNomi(c);
    if (s === 'visa') return isVisa(c);
    if (s === 'drop') return isDrop(c);
    if (s === 'closed') return grp(c) === 'hold' || grp(c) === 'drop';
    if (s.startsWith('g:')) return grp(c) === s.slice(2);
    return c.status === s;
  }
  function matchOhla(c, o) {
    if (o === 'all') return true;
    if (o === NONE_KEY) return !(c.ohla || '').trim();
    return keyOf(c.ohla) === o;
  }
  function partnerChecks(scope, sel, base, withAll) {
    return `<span class="lbl">담당</span>` + PARTNERS.map((p) => `<label class="ck-chip ${PCLS[p]}"><input type="checkbox" id="${scope}-p-${PCLS[p]}" data-pcheck="${scope}" value="${p}"${sel.includes(p) ? ' checked' : ''}>${PLABEL[p]} <span class="c">${base.filter((c) => partnerOf(c) === p).length}</span></label>`).join('') +
      (withAll ? `<button class="linkbtn" type="button" data-pall="${scope}" style="margin-left:4px">${sel.length === PARTNERS.length ? '모두 해제' : '모두 선택'}</button>` : '');
  }

  /* ================= router ================= */
  let mounted = null;
  function go(route) {
    if (!V[route]) route = 'dashboard';
    state.route = route;
    try { history.replaceState(null, '', '#' + route); } catch (e) {}
    mounted = null;
    refresh();
    window.scrollTo(0, 0);
  }
  function refresh() {
    renderChrome();
    const v = V[state.route];
    if (mounted !== state.route) { $('view').innerHTML = v.mount(); mounted = state.route; if (v.afterMount) v.afterMount(); }
    v.update();
    fillNames();
  }

  /* ================= data writes ================= */
  function persistLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ clients: state.clients, ohla: state.ohla, hosts: state.hosts, invoices: state.invoices })); } catch (e) {} }
  async function retryOnce(fn) {
    try { return await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
      throw e;
    }
  }
  const store = {
    newId(col) { return state.mode === 'live' ? db.collection(col).doc().id : 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); },
    async set(col, id, data) {
      if (state.mode === 'local') { state[col] = [...state[col].filter((x) => x.id !== id), { id, ...data }]; persistLocal(); refresh(); return; }
      await retryOnce(() => db.doc(col + '/' + id).set(data));
    },
    async update(col, id, data) {
      if (state.mode === 'local') { state[col] = state[col].map((x) => (x.id === id ? { ...x, ...data } : x)); persistLocal(); refresh(); return; }
      await retryOnce(() => db.doc(col + '/' + id).update(data));
    },
    async del(col, id) {
      if (state.mode === 'local') { state[col] = state[col].filter((x) => x.id !== id); persistLocal(); refresh(); return; }
      await retryOnce(() => db.doc(col + '/' + id).delete());
    },
  };
  const stamp = () => ({ updatedAt: new Date().toISOString(), updatedBy: myId || null });
  function writeFailed(e) {
    const code = e && e.code;

    if (code === 'quota_exceeded') return '저장 공간이 가득 찼어요. 사용하지 않는 항목을 삭제한 뒤 다시 시도해 주세요.';
    if (code === 'resource_exhausted') return '요청이 너무 많아요. 잠시 후 다시 저장해 주세요.';

    if (cl) { cl.dataset.close === 'client' ? closeClient() : cl.dataset.close === 'inv' ? closeInv() : closeComp(); return; }
    if (t.closest('#invScrim')) { closeInv(); return; }
    if (t.closest('[data-act="add-inv"]')) { openInv(null); return; }
    const pay = t.closest('[data-pay]');
    if (pay) { markPaid(pay.dataset.pay); return; }
    const bl = t.closest('[data-biller]');
    if (bl) { state.money.biller = state.money.biller === bl.dataset.biller ? 'all' : bl.dataset.biller; refresh(); return; }
    const mt = t.closest('[data-mtab]');
    if (mt) { state.money.view = mt.dataset.mtab; refresh(); return; }
    if (t.closest('#mReset')) { state.money.biller = 'all'; refresh(); return; }
    if (t.closest('#invExport')) { exportInvCsv(); return; }
    if (t.closest('#pdfBtn')) {
      const b = state.money.biller;
      exportPdf('money', b === 'all' ? BILLERS.map((x) => x.k) : [b], b === 'all' ? '전체' : (BM[b] || {}).l.replace(/\s+/g, ''), 'pdfLbl'); return;
    }
    const pa1 = t.closest('[data-pdf-all]');
    if (pa1) {
      const kd = pa1.dataset.pdfAll;
      const keys = companies(kd).filter((x) => x.clients.length).map((x) => x.key);
      if (state.clients.some((c) => !(c[KIND[kd].field] || '').trim())) keys.push(NONE_KEY);
      exportPdf(kd, keys, kd === 'hosts' ? '전체HostCompany' : '전체OHLA', kd + 'PdfAllLbl'); return;
    }
    const op1 = t.closest('[data-pdf-one]');
    if (op1) {
      const kd = op1.dataset.pdfOne, k = op1.dataset.key; const x = companies(kd).find((y) => y.key === k);
      exportPdf(kd, [k], (x ? x.name : KIND[kd].none).replace(/[^A-Za-z0-9가-힣]+/g, ''), kd + 'PdfOneLbl'); return;
    }
    if (t.closest('#rosterPdf')) {
      const ps = state.roster.partners;
      const all = ps.length === PARTNERS.length;
      const keys = BILLERS.map((x) => x.k).filter((k) => all || ps.includes(k));
      exportPdf('full', keys, all ? '전체' : ps.join('_'), 'rosterPdfLbl'); return;
    }
    const gb = t.closest('[data-go-biller]');
    if (gb) { state.money.biller = gb.dataset.goBiller; state.money.view = 'open'; go('money'); return; }
    const oi = t.closest('[data-open-inv]');
    if (oi && !t.closest('select')) { openInv(oi.dataset.openInv); return; }
    if (t.closest('#clientScrim')) { closeClient(); return; }
    if (t.closest('#compScrim')) { closeComp(); return; }
    if (t.closest('#addBtn') || t.closest('[data-act="add-client"]')) { openClient(null); return; }
    const ac = t.closest('[data-act="add-comp"]');
    if (ac) { openComp(ac.dataset.kind, null); return; }
    const ec = t.closest('[data-edit-comp]');
    if (ec) { openComp(ec.dataset.editComp, ec.dataset.key); return; }
    const dt = t.closest('[data-dtab]');
    if (dt) { state.dashTab = dt.dataset.dtab; V.dashboard.update(); return; }
    const rs = t.closest('[data-roster-status]');
    if (rs) { Object.assign(state.roster, { status: rs.dataset.rosterStatus, q: '', ohla: 'all', partners: [...PARTNERS] }); savePrefs(); go('clients'); return; }
    const rp = t.closest('[data-roster-partner]');
    if (rp) { Object.assign(state.roster, { partners: [rp.dataset.rosterPartner], status: 'all', q: '', ohla: 'all' }); savePrefs(); go('clients'); return; }
    const oc = t.closest('[data-open-comp]');
    if (oc) { state.comp[oc.dataset.openComp].sel = oc.dataset.key; state.comp[oc.dataset.openComp].q = ''; go(oc.dataset.openComp); return; }
    const sc = t.closest('[data-sel-comp]');
    if (sc) { state.comp[sc.dataset.selComp].sel = sc.dataset.key; V[state.route].update(); return; }
    const so = t.closest('[data-sort]');
    if (so) { const k = so.dataset.sort; if (state.roster.sortKey === k) state.roster.sortDir *= -1; else { state.roster.sortKey = k; state.roster.sortDir = k === 'updatedAt' ? -1 : 1; } savePrefs(); refresh(); return; }
    const pa = t.closest('[data-pall]');
    if (pa) { const f = state[pa.dataset.pall]; f.partners = f.partners.length === PARTNERS.length ? [] : [...PARTNERS]; savePrefs(); refresh(); return; }
    if (t.closest('#rosterReset')) { Object.assign(state.roster, { q: '', status: 'all', ohla: 'all', partners: [...PARTNERS] }); $('rosterQ').value = ''; savePrefs(); refresh(); return; }
    if (t.closest('#exportBtn')) { exportCsv(); return; }
    if (t.closest('select')) return;
    const oc2 = t.closest('[data-open-client]');
    if (oc2) { openClient(oc2.dataset.openClient); return; }
    const kc = t.closest('[data-card]');
    if (kc) { openClient(kc.dataset.card); return; }
  });
  document.addEventListener('keydown', (ev) => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); $('gq').focus(); $('gq').select(); return; }
    if (ev.key === 'Escape') { if (state.editClient !== null) closeClient(); else if (state.editComp !== null) closeComp(); else if (state.editInv !== null) closeInv(); return; }
    const t = ev.target;
    if (t === $('gq') && ev.key === 'Enter') {
      ev.preventDefault();
      Object.assign(state.roster, { q: t.value.trim(), status: 'all', ohla: 'all', partners: [...PARTNERS] }); savePrefs();
      go('clients'); t.value = ''; t.blur(); return;
    }
    if ((ev.key === 'Enter' || ev.key === ' ') && t instanceof Element && !t.closest('select, input, button, textarea')) {
      const oi = t.closest('[data-open-inv]');
      if (oi) { ev.preventDefault(); openInv(oi.dataset.openInv); return; }
      const o = t.closest('[data-open-client], [data-card]');
      if (o) { ev.preventDefault(); openClient(o.dataset.openClient || o.dataset.card); }
    }
  });
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (!(t instanceof HTMLElement)) return;
    if (t.dataset.statusOf) { setStatus(t.dataset.statusOf, t.value); return; }
    if (t.dataset.pcheck) {
      const f = state[t.dataset.pcheck];
      f.partners = PARTNERS.filter((p) => (p === t.value ? t.checked : f.partners.includes(p)));
      savePrefs(); refresh(); return;
    }
    if (t.id === 'pipeClosed') { state.pipe.showClosed = t.checked; savePrefs(); refresh(); return; }
    if (t.id === 'rosterStatus') { state.roster.status = t.value; savePrefs(); refresh(); return; }
    if (t.id === 'rosterOhla') { state.roster.ohla = t.value; savePrefs(); refresh(); return; }
  });
  let qT = 0;
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (!(t instanceof HTMLInputElement)) return;
    const map = { pipeQ: () => { state.pipe.q = t.value.trim(); }, rosterQ: () => { state.roster.q = t.value.trim(); }, ohlaQ: () => { state.comp.ohla.q = t.value; }, hostsQ: () => { state.comp.hosts.q = t.value; }, moneyQ: () => { state.money.q = t.value; } };
    if (!map[t.id]) return;
    clearTimeout(qT);
    qT = setTimeout(() => { map[t.id](); savePrefs(); refresh(); }, 120);
  });
  try { if (/Mac|iPhone|iPad/.test(navigator.platform)) $('kbdHint').textContent = '⌘ K'; } catch (e) {}

  /* drag & drop */
  let dragId = null;
  document.addEventListener('dragstart', (ev) => {
    const c = ev.target instanceof Element && ev.target.closest('[data-card]');
    if (!c || !state.canWrite) return;
    dragId = c.dataset.card; c.classList.add('dragging');
    try { ev.dataTransfer.setData('text/plain', dragId); ev.dataTransfer.effectAllowed = 'move'; } catch (e) {}
  });
  document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging, .over').forEach((el) => el.classList.remove('dragging', 'over')); });
  document.addEventListener('dragover', (ev) => {
    const col = ev.target instanceof Element && ev.target.closest('[data-drop]');
    if (!col || !dragId) return;
    ev.preventDefault();
    document.querySelectorAll('.kcol.over').forEach((el) => { if (el !== col) el.classList.remove('over'); });
    col.classList.add('over');
  });
  document.addEventListener('drop', (ev) => {
    const col = ev.target instanceof Element && ev.target.closest('[data-drop]');
    if (!col || !dragId) return;
    ev.preventDefault();
    const id = dragId; dragId = null;
    col.classList.remove('over');
    setStatus(id, col.dataset.drop);
  });

  async function exportCsv() {
    if (!downloads) return;
    const shown = V.clients.shown || [];
    const head = ['원본 No.', '고객명', '직군', '담당', '전화번호', '이메일', 'OHLA Company', 'Host Company', '진행 상태', '진행범위', '노미 신청일', '노미 승인일', '비자 신청일', '비자 승인일', '현재 메모', '다음 액션', '확인 메모', '최근 수정'];
    const cell = (v) => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [head, ...shown.map((c) => [c.no ?? '', c.name, c.job, partnerOf(c), c.phone, c.email, c.ohla, c.host, c.status, c.scope, c.nomiApplied, c.nomiGranted, c.visaApplied, c.visaGranted, c.memo, c.next, c.check, (c.updatedAt || '').slice(0, 10)])].map((r) => r.map(cell).join(','));
    const d = new Date(); const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    try { await downloads.save({ filename: `ANS_고객목록_${ymd}.csv`, data: '﻿' + lines.join('\r\n') }); toast('CSV 파일을 저장했어요'); }
    catch (e) { if (e && e.code !== 'declined') toast('파일을 저장하지 못했어요. 잠시 후 다시 시도해 주세요.'); }
  }

  /* ================= boot ================= */
  function startLocal() {
    state.mode = 'local';
    try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); state.clients = d.clients || []; state.ohla = d.ohla || []; state.hosts = d.hosts || []; state.invoices = d.invoices || []; } catch (e) {}
    const n = $('notice');
    n.textContent = '로컬 미리보기예요. 이 브라우저에만 저장되고, claude.ai에서 포털을 열면 직원 모두와 실시간으로 공유돼요.';
    n.hidden = false;
    refresh();
  }
  async function boot() {
    const h = (location.hash || '').slice(1);
    state.route = V[h] ? h : 'dashboard';
    refresh();
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { startLocal(); return; }
    [db, user, downloads] = await Promise.all([c.use('db'), c.use('user'), c.use('downloads')]);
    if (!db) { startLocal(); return; }
    if (user) {
      user.can('data.write').then((v) => { if (v === false) { state.canWrite = false; refresh(); } });
      user.me().then((me) => {
        myId = me.id; myName = me.name || '';
        if (me.id) {
          $('meAvatar').src = me.avatarUrl; $('meName').textContent = me.name || '직원'; $('profile').hidden = false;
        }
        if (state.route === 'dashboard' && state.mode !== 'loading') V.dashboard.update();
      });
    }
    let firstClients = false;
    const sub = (col) => db.collection(col).limit(1000).onSnapshot((snap) => {
      state[col] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (col === 'clients') firstClients = true;
      if (firstClients) state.mode = 'live';
      if (state.mode === 'live') refreshSoft();
    }, (err) => {
      const n = $('notice');
      n.textContent = err && err.code === 'revoked' ? '이 포털에 접근할 수 없게 되었어요.' : '데이터 연결이 끊겼어요. 페이지를 새로고침해 주세요.';
      n.hidden = false;
    });
    sub('clients'); sub('ohla'); sub('hosts'); sub('invoices');
  }
  function refreshSoft() {
    const a = document.activeElement;
    if (a && a.tagName === 'SELECT' && a.closest('#view')) { setTimeout(refreshSoft, 800); return; }
    refresh();
  }
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (V[h] && h !== state.route) go(h); });
  setInterval(() => { if (state.mode !== 'loading' && state.editClient === null && state.editComp === null && state.editInv === null) refreshSoft(); }, 60000);
  boot();
})();
</script>
